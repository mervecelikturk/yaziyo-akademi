<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="YAZİYO Ders — Klavye derslerini adım adım tamamlayın.">
    <title>Ders — YAZİYO</title>
    <link rel="icon" type="image/png" href="../../images/favicon-48.png" sizes="48x48">
    <link rel="icon" href="../../favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="../../images/logo.png" sizes="192x192">
    <link rel="apple-touch-icon" href="../../images/logo.png">
    <link rel="canonical" href="https://yaziyoakademi.com/pages/ders-oyunu/">

    <script>
        (function () {
            if (!sessionStorage.getItem('yaziyo-session-active')) {
                localStorage.setItem('yaziyo-theme', 'light');
                sessionStorage.setItem('yaziyo-session-active', 'true');
            }
            const savedTheme = localStorage.getItem('yaziyo-theme');
            if (savedTheme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        })();
    </script>
    <script src="../../js/authBoot.js"></script>
    <script src="../../js/lib/sitePaths.js"></script>
    <script type="module" src="../../js/auth.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6139144813128892"
     crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <style id="dlo-critical">
        .dlo-setup {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem 2.5rem;
            min-height: calc(100vh - 7rem);
            background: rgb(var(--yaziyo-bg-rgb));
        }
        .dlo-setup.is-hidden { display: none !important; }

        .dlo-settings-card {
            width: 100%;
            max-width: 26rem;
            border-radius: 22px;
            border: 1px solid rgb(var(--yaziyo-gold-rgb) / 0.28);
            background: linear-gradient(165deg, rgb(255 255 255 / 0.94), rgb(255 255 255 / 0.78));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 22px 50px rgb(15 23 42 / 0.12);
            padding: 1.6rem 1.45rem 1.4rem;
        }
        .dark .dlo-settings-card {
            background: linear-gradient(165deg, rgb(30 41 59 / 0.95), rgb(15 23 42 / 0.9));
            border-color: rgb(var(--yaziyo-gold-rgb) / 0.35);
        }
        .dlo-settings-kicker {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgb(var(--yaziyo-gold-rgb));
            font-family: 'Poppins', sans-serif;
            margin: 0 0 0.35rem;
        }
        .dlo-settings-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 1.35rem;
            color: rgb(var(--yaziyo-text-rgb));
            margin: 0 0 0.35rem;
        }
        .dlo-settings-sub {
            font-size: 0.875rem;
            color: rgb(var(--yaziyo-text-rgb) / 0.62);
            margin: 0 0 1.2rem;
            line-height: 1.45;
        }
        .dlo-settings-field {
            margin-bottom: 1rem;
        }
        .dlo-settings-field label {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            color: rgb(var(--yaziyo-text-rgb) / 0.75);
            margin-bottom: 0.4rem;
        }
        .dlo-lesson-dd {
            position: relative;
            width: 100%;
        }
        .dlo-lesson-dd-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.75rem 0.9rem;
            border-radius: 12px;
            border: 1px solid rgb(var(--yaziyo-border-rgb) / 0.9);
            background: rgb(var(--yaziyo-card-rgb));
            color: rgb(var(--yaziyo-text-rgb));
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .dlo-lesson-dd-btn:focus,
        .dlo-lesson-dd.is-open .dlo-lesson-dd-btn {
            border-color: rgb(var(--yaziyo-gold-rgb) / 0.7);
            box-shadow: 0 0 0 3px rgb(var(--yaziyo-gold-rgb) / 0.18);
        }
        .dlo-lesson-dd-btn i {
            color: #D97706;
            font-size: 0.75rem;
            transition: transform .15s ease;
        }
        .dlo-lesson-dd.is-open .dlo-lesson-dd-btn i {
            transform: rotate(180deg);
        }
        .dlo-lesson-dd-menu {
            display: none;
            position: absolute;
            top: calc(100% + 0.35rem);
            left: 0;
            right: 0;
            z-index: 20;
            max-height: 11.5rem;
            overflow-y: auto;
            overscroll-behavior: contain;
            border-radius: 12px;
            border: 1px solid rgb(var(--yaziyo-border-rgb) / 0.9);
            background: rgb(var(--yaziyo-card-rgb));
            box-shadow: 0 10px 28px rgb(15 23 42 / 0.12);
            padding: 0.3rem;
        }
        .dlo-lesson-dd.is-open .dlo-lesson-dd-menu {
            display: block;
        }
        .dlo-lesson-dd-item {
            width: 100%;
            display: block;
            padding: 0.55rem 0.75rem;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: rgb(var(--yaziyo-text-rgb));
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            text-align: left;
            cursor: pointer;
        }
        .dlo-lesson-dd-item:hover:not(:disabled) {
            background: rgb(var(--yaziyo-gold-rgb) / 0.1);
        }
        .dlo-lesson-dd-item.is-selected {
            background: rgb(var(--yaziyo-gold-rgb) / 0.16);
            font-weight: 600;
        }
        .dlo-lesson-dd-item:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .dlo-settings-progress {
            font-size: 0.78rem;
            color: rgb(var(--yaziyo-text-rgb) / 0.55);
            margin: -0.35rem 0 1rem;
        }
        .dlo-settings-opts {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-bottom: 1.25rem;
        }
        .dlo-settings-opt {
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            padding: 0.75rem 0.85rem;
            border-radius: 12px;
            border: 1px solid rgb(var(--yaziyo-border-rgb) / 0.85);
            background: rgb(var(--yaziyo-card-rgb) / 0.65);
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }
        .dlo-settings-opt:hover { border-color: rgb(var(--yaziyo-gold-rgb) / 0.45); }
        .dlo-settings-opt input {
            margin-top: 0.2rem;
            width: 1.05rem;
            height: 1.05rem;
            accent-color: #D97706;
            flex-shrink: 0;
        }
        .dlo-settings-opt strong {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: rgb(var(--yaziyo-text-rgb));
        }
        .dlo-settings-opt span {
            display: block;
            font-size: 0.78rem;
            color: rgb(var(--yaziyo-text-rgb) / 0.55);
            margin-top: 0.15rem;
            line-height: 1.4;
        }
        .dlo-settings-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: stretch;
        }
        .dlo-settings-btn {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 12px;
            padding: 0.8rem 1.15rem;
            border: none;
            cursor: pointer;
            transition: transform .12s, box-shadow .12s;
            flex: 1;
        }
        .dlo-settings-btn:active { transform: scale(0.97); }
        .dlo-settings-btn--ghost {
            flex: 0 0 auto;
            background: transparent;
            color: rgb(var(--yaziyo-text-rgb) / 0.65);
            border: 1px solid rgb(var(--yaziyo-border-rgb));
        }
        .dlo-settings-btn--primary {
            background: linear-gradient(135deg, #f59e0b, #D97706);
            color: #1e293b;
            box-shadow: 0 4px 14px rgb(var(--yaziyo-gold-rgb) / 0.35);
        }
        .dlo-settings-btn--primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .dlo-exam {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: none;
            flex-direction: column;
            background: #ffffff;
            color: #0f172a;
        }
        .dlo-exam.is-open { display: flex; }
        .dlo-exam-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.65rem 1rem;
            border-bottom: 1px solid rgba(15, 23, 42, 0.06);
            flex-shrink: 0;
        }
        .dlo-exam-exit {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.1);
            background: #fff;
            color: #64748b;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color .15s, border-color .15s, background .15s;
        }
        .dlo-exam-exit:hover { color: #dc2626; border-color: rgba(220,38,38,.35); background: #fef2f2; }
        .dlo-exam-timer {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.04em;
            color: #334155;
            min-width: 4.5rem;
            text-align: right;
        }
        .dlo-exam-timer:not(.is-visible) { opacity: 0.35; }
        .dlo-exam-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem 1rem 0.35rem;
            gap: 0.75rem;
            overflow: hidden;
        }
        .dlo-exam-panels {
            width: 100%;
            max-width: 56rem;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
        .dlo-exam .dlo-text-card {
            position: relative;
            overflow: hidden;
            flex: 1 1 0;
            min-height: 12rem;
            max-height: none;
            border-radius: 14px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            background: #fafafa;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
        }
        .dlo-exam .dlo-text-content {
            position: absolute;
            left: 0; right: 0; top: 0;
            color: #64748b;
            font-size: 1.1rem;
            line-height: 1.6;
            padding: 1.25rem 1.5rem;
            transform-origin: top;
            will-change: transform;
        }
        .dlo-exam .dlo-input {
            width: 100%;
            flex: 1 1 0;
            min-height: 11rem;
            border-radius: 14px;
            border: 1.5px solid rgb(var(--yaziyo-gold-rgb) / 0.4);
            background: #fff;
            color: #0f172a;
            font-size: 1.1rem;
            line-height: 1.6;
            padding: 1.25rem 1.5rem;
            resize: none;
            outline: none;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
            font-family: 'Inter', sans-serif;
        }
        .dlo-exam .dlo-input:focus {
            border-color: rgb(var(--yaziyo-gold-rgb) / 0.75);
            box-shadow: 0 0 0 3px rgb(var(--yaziyo-gold-rgb) / 0.18);
        }
        .dlo-next-key {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            padding: 0.75rem 1rem 1rem;
            flex-shrink: 0;
        }
        .dlo-next-key-label {
            font-family: 'Poppins', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #94a3b8;
        }
        .dlo-next-key-value {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 3rem;
            min-height: 3rem;
            padding: 0.35rem 0.85rem;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            color: #1e293b;
            background: linear-gradient(180deg, #ffedd5, #fb923c);
            border: 1.5px solid rgb(var(--yaziyo-gold-rgb) / 0.55);
            box-shadow: 0 4px 14px rgb(var(--yaziyo-gold-rgb) / 0.25);
        }
        .dlo-next-key-finger {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #334155;
        }
        .dlo-exam[data-highlight="off"] .dlo-char-correct,
        .dlo-exam[data-highlight="off"] .dlo-char-wrong,
        .dlo-exam[data-highlight="off"] .dlo-char-current {
            color: inherit;
            background: transparent;
            text-decoration: none;
            box-shadow: none;
        }
        .dlo-exam[data-highlight="on"] .dlo-char-correct {
            color: #16a34a;
            text-decoration: underline;
            text-decoration-color: #16a34a;
            text-underline-offset: 3px;
        }
        .dlo-exam[data-highlight="on"] .dlo-char-wrong {
            color: #dc2626;
            text-decoration: underline;
            text-decoration-color: #dc2626;
            text-underline-offset: 3px;
            background: rgba(239, 68, 68, 0.1);
        }
        .dlo-exam[data-highlight="on"] .dlo-char-current {
            color: #ea580c;
            background: transparent;
            box-shadow: none;
            text-decoration: underline;
            text-decoration-color: #ea580c;
            text-underline-offset: 3px;
            text-decoration-thickness: 2px;
        }

        @media (max-width: 640px) {
            .dlo-exam-panels { max-width: 100%; }
            .dlo-exam .dlo-text-card { min-height: 9rem; }
            .dlo-exam .dlo-input { min-height: 8rem; font-size: 1rem; }
            .dlo-exam .dlo-text-content { padding: 1rem 1.1rem; font-size: 1.02rem; }
        }
    </style>
</head>

<body data-yaziyo-nav-active="klavye-calismalari"
    class="bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text font-inter min-h-screen flex flex-col transition-colors duration-300">

    <header id="main-header"
        class="w-full bg-light-bg/95 dark:bg-dark-bg/95 backdrop-blur-md sticky top-0 z-50 transition-colors duration-300">
    </header>

    <!-- Ayarlar kartı (ders listesi sağda değil — burada) -->
    <div class="dlo-setup" id="dlo-setup">
        <div class="dlo-settings-card" role="dialog" aria-labelledby="dlo-settings-title">
            <p class="dlo-settings-kicker" id="dlo-track-title">Dersler</p>
            <h1 class="dlo-settings-title" id="dlo-settings-title">Çalışma Ayarları</h1>
            <p class="dlo-settings-sub">Dersi seçin, isteğe bağlı harf takibini ayarlayın, ardından başlayın.</p>

            <div class="dlo-settings-field">
                <label id="dlo-lesson-label">Ders seçin</label>
                <div class="dlo-lesson-dd" id="dlo-lesson-dd">
                    <button type="button" class="dlo-lesson-dd-btn" id="dlo-lesson-dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="dlo-lesson-label">
                        <span id="dlo-lesson-dd-label">Ders seçin</span>
                        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                    </button>
                    <div class="dlo-lesson-dd-menu" id="dlo-lesson-dd-menu" role="listbox" hidden></div>
                    <input type="hidden" id="dlo-lesson-select" value="">
                </div>
            </div>
            <p class="dlo-settings-progress" id="dlo-progress-label">0 / 30 tamamlandı</p>

            <div class="dlo-settings-opts">
                <label class="dlo-settings-opt">
                    <input type="checkbox" id="dlo-opt-keys" checked>
                    <div>
                        <strong>Harf takibi</strong>
                        <span>Yazılan harfler altı çizili; doğru yeşil, yanlış kırmızı görünür.</span>
                    </div>
                </label>
            </div>

            <div class="dlo-settings-actions">
                <a href="../dersler/" class="dlo-settings-btn dlo-settings-btn--ghost" id="dlo-back-link">Geri</a>
                <button type="button" class="dlo-settings-btn dlo-settings-btn--primary" id="dlo-settings-start">Başla</button>
            </div>
        </div>
    </div>

    <!-- Çalışma ekranı -->
    <div class="dlo-exam" id="dlo-exam" data-highlight="on" hidden>
        <div class="dlo-exam-top">
            <button type="button" class="dlo-exam-exit" id="dlo-exam-exit" aria-label="Dersi bitir (Esc)">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="dlo-exam-timer" id="dlo-timer-wrap" aria-live="polite">
                <span id="dlo-timer">00:00</span>
            </div>
        </div>
        <div class="dlo-exam-body">
            <div class="dlo-exam-panels">
                <div class="dlo-text-card" id="dlo-text-card">
                    <div class="dlo-text-content" id="dlo-text-content"></div>
                </div>
                <textarea id="dlo-input" class="dlo-input" lang="tr" spellcheck="false" autocomplete="off"
                    autocorrect="off" autocapitalize="off" placeholder="Yazmaya başlayın..." readonly></textarea>
            </div>
            <div class="dlo-next-key" id="dlo-next-key" aria-live="polite">
                <span class="dlo-next-key-label">Basılacak tuş</span>
                <span class="dlo-next-key-value" id="dlo-next-key-value">—</span>
                <span class="dlo-next-key-finger" id="dlo-next-key-finger">—</span>
            </div>
        </div>
    </div>

    <!-- Sonuç -->
    <div class="dlo-result-overlay hidden" id="dlo-result" role="dialog" aria-modal="true" aria-labelledby="dlo-result-title">
        <div class="dlo-result-panel">
            <div class="dlo-result-head">
                <h2 class="dlo-result-title" id="dlo-result-title">Ders Sonucu</h2>
                <button type="button" class="text-light-text-secondary hover:text-red-500 p-2" id="dlo-result-close" aria-label="Kapat">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="dlo-result-body">
                <div class="dlo-result-hero" id="dlo-result-hero">
                    <div class="text-xs uppercase tracking-widest font-bold text-light-text-secondary dark:text-dark-text-secondary mb-1">Başarı Oranı</div>
                    <div class="dlo-result-rate" id="dlo-result-rate">0%</div>
                    <p class="text-sm mt-2" id="dlo-result-message"></p>
                </div>
                <div class="dlo-result-grid">
                    <div class="dlo-result-stat">
                        <div class="dlo-result-stat-label">Doğru Kelime</div>
                        <div class="dlo-result-stat-value text-green-500" id="dlo-stat-correct">0</div>
                    </div>
                    <div class="dlo-result-stat">
                        <div class="dlo-result-stat-label">Yanlış Kelime</div>
                        <div class="dlo-result-stat-value text-red-500" id="dlo-stat-wrong">0</div>
                    </div>
                    <div class="dlo-result-stat">
                        <div class="dlo-result-stat-label">En Çok Kullanılan Harf</div>
                        <div class="dlo-result-stat-value" id="dlo-stat-most">—</div>
                    </div>
                </div>
                <div class="dlo-result-kazanim hidden" id="dlo-result-kazanim">
                    <i class="fa-solid fa-lightbulb text-yaziyo-gold"></i>
                    <p id="dlo-result-kazanim-text"></p>
                </div>
                <div class="dlo-result-actions">
                    <button type="button" class="dlo-result-btn dlo-result-btn--save" id="dlo-btn-save">Sonuçları Kaydet</button>
                    <button type="button" class="dlo-result-btn dlo-result-btn--primary hidden" id="dlo-btn-continue">Devam Et</button>
                    <button type="button" class="dlo-result-btn dlo-result-btn--secondary hidden" id="dlo-btn-retry">Tekrar Et</button>
                    <button type="button" class="dlo-result-btn dlo-result-btn--primary hidden" id="dlo-btn-redo">Yeniden Dene</button>
                </div>
            </div>
        </div>
    </div>

    <div class="dlo-toast" id="dlo-toast" role="status"></div>

    <script src="../../js/derslerMetinleriF.js"></script>
    <script src="../../js/derslerMetinleriQ.js"></script>
    <script src="../../js/derslerMetinleri.js"></script>
    <script src="../../js/lib/typingTextScroll.js"></script>
    <script src="../../js/lib/klavyeTypingCore.js"></script>
    <script src="../../js/pageStatus.js"></script>
    <script src="../../js/siteNavbar.js"></script>
    <script src="../../js/main.js"></script>
    <script type="module" src="../../js/derslerOyun.js"></script>
</body>

</html>
